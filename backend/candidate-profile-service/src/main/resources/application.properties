spring.application.name=candidate-profile-service

spring.datasource.url=jdbc:mysql://localhost:3306/p11_job_portal
spring.datasource.username=root
spring.datasource.password=root


spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
server.port=8082
#this will not expose the stack trace to clients.
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB



#It is useful because jpa convert the camelCase to snakecase it will cause to create the new column if update 
#That why this prevent from the error and use only those name we provide
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl