spring.application.name=employer-profile

server.port = 8085
spring.datasource.url=jdbc:mysql://localhost:3306/p11_job_portal
spring.datasource.username=root
spring.datasource.password=root


spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#this will not expose the stack trace to clients.
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always



#It is useful because jpa convert the camelCase to snakecase it will cause to create the new column if update 
#That why this prevent from the error and use only those name we provide
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl