spring.application.name=job-application-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/p11_job_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Avoid stack trace exposure
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always

# Multipart configurations for optional resume uploads in job application context
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Hibernate Physical naming strategy to match table schema exactly
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

eureka.client.registerWithEureka=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.preferIpAddress=true
